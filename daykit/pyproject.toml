[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daykit"
version = "0.1.0"
description = "A lightweight Python toolkit for everyday routines, time utilities, and productivity."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Ishara Gold" }
]
keywords = ["utilities", "productivity", "time", "daily", "student"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/daykit"
Repository = "https://github.com/YOUR_USERNAME/daykit"
Issues = "https://github.com/YOUR_USERNAME/daykit/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["Django>=5.0,<6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
