{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Airport Flow{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'crewlog/styles.css' %}">
    <script src="{% static 'crewlog/app.js' %}" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'crewlog:dashboard' %}">
            <span class="brand-mark">AF</span>
            <span>Airport Flow</span>
        </a>
        <nav class="nav">
            <a href="{% url 'crewlog:flight_list' %}">Flights</a>
            <a href="{% url 'crewlog:attendant_list' %}">Attendants</a>
            <a href="{% url 'crewlog:assignment_list' %}">Assignments</a>
            <a href="{% url 'admin:index' %}">Admin</a>
        </nav>
        <span class="live-clock" data-clock></span>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
